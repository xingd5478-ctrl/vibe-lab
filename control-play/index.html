<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Control Play · 二阶系统 · vibe-lab</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="kicker">vibe-lab / instrument 02</div>
      <h1>Control Play · 二阶系统</h1>
      <p class="sub">G(s) = ωn² / (s² + 2ζωn·s + ωn²) · 拖动滑杆，实时看 Bode 与阶跃响应。</p>
    </header>

    <div class="layout">
      <aside class="panel controls">
        <div class="field">
          <label for="wn">自然频率 ωn <output id="wn-val">4.0</output></label>
          <input id="wn" type="range" min="0.5" max="20" step="0.1" value="4" aria-label="自然频率" />
        </div>

        <div class="field">
          <label for="zeta">阻尼比 ζ <output id="zeta-val">0.40</output></label>
          <input id="zeta" type="range" min="0.05" max="2" step="0.01" value="0.4" aria-label="阻尼比" />
        </div>

        <div class="field">
          <label for="kp">Kp <output id="kp-val">1.50</output></label>
          <input id="kp" type="range" min="0" max="10" step="0.05" value="1.5" aria-label="比例增益 Kp" />
        </div>

        <div class="field">
          <label for="ki">Ki <output id="ki-val">0.50</output></label>
          <input id="ki" type="range" min="0" max="10" step="0.05" value="0.5" aria-label="积分增益 Ki" />
        </div>

        <div class="field">
          <label for="kd">Kd <output id="kd-val">0.050</output></label>
          <input id="kd" type="range" min="0" max="2" step="0.005" value="0.05" aria-label="微分增益 Kd" />
        </div>

        <div class="metrics">
          <div>超调量（闭环） <b id="overshoot">—</b></div>
          <div>峰值时间 <b id="peak">—</b></div>
          <div>调节时间（±2%） <b id="settle">—</b></div>
          <div>稳态误差 <b id="ess">—</b></div>
        </div>

        <p class="hint">Kp 加快响应但增大超调；Ki 消除稳态误差但易振荡；Kd 抑制超调、放大噪声。拖滑杆对比开环/闭环。</p>
      </aside>

      <section class="charts">
        <div class="panel">
          <div class="panel-head">
            <h2>Bode 图</h2>
            <span class="meta" id="meta-bode">—</span>
          </div>
          <div class="chart" id="bode"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>阶跃响应</h2>
            <span class="meta" id="meta-step">—</span>
          </div>
          <div class="chart" id="step"></div>
        </div>
      </section>
    </div>

    <footer>
      vibe-lab · 零依赖 SVG · 参数同步到 URL（<span id="url-params">—</span>） · 仅用于教学/复习演示 ·
      <a href="../">← vibe-lab</a> · <a href="../imu/">IMU Lab →</a> · <a href="../about/">方法说明</a>
    </footer>
  </div>

  <div id="chart-live" class="sr-only" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
