<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Control Play · 二阶系统</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root { --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color:var(--ink); background:#fafafa; }
    header { padding:24px 28px 8px; }
    header h1 { margin:0 0 6px; font-size:22px; }
    header p { margin:0; color:var(--muted); font-size:13px; }
    .wrap { display:grid; grid-template-columns: 280px 1fr; gap:18px; padding:18px 28px 32px; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
    .control { margin-bottom:18px; }
    .control label { display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
    .control output { color:var(--accent); font-variant-numeric: tabular-nums; }
    input[type=range] { width:100%; }
    .stats { font-size:13px; color:var(--muted); line-height:1.9; }
    .stats b { color:var(--ink); font-variant-numeric: tabular-nums; }
    .plots { display:grid; gap:18px; }
    @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Control Play · 二阶系统</h1>
    <p>G(s) = ωn² / (s² + 2ζωn·s + ωn²) · 拖动滑杆实时看 Bode 与阶跃响应</p>
  </header>

  <div class="wrap">
    <aside class="panel">
      <div class="control">
        <label>自然频率 ωn <output id="wn-val">4.0</output></label>
        <input id="wn" type="range" min="0.5" max="20" step="0.1" value="4" />
      </div>
      <div class="control">
        <label>阻尼比 ζ <output id="zeta-val">0.40</output></label>
        <input id="zeta" type="range" min="0.05" max="2" step="0.01" value="0.4" />
      </div>
      <div class="stats">
        <div>超调量：<b id="overshoot">—</b></div>
        <div>调节时间（±2%）：<b id="settle">—</b></div>
        <div>峰值时间：<b id="peak">—</b></div>
      </div>
    </aside>

    <section class="plots">
      <div class="panel"><div id="bode" style="height:320px;"></div></div>
      <div class="panel"><div id="step" style="height:300px;"></div></div>
    </section>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const range = (a, b, n) => Array.from({length: n}, (_, i) => a + (b - a) * i / (n - 1));

    function bode(wn, zeta) {
      const w = range(0.1, 100, 400);
      const mag = [], phase = [];
      for (const wi of w) {
        // H(jw) = wn^2 / (wn^2 - w^2 + j*2*zeta*wn*w)
        const re = wn * wn - wi * wi;
        const im = 2 * zeta * wn * wi;
        const den = re * re + im * im;
        mag.push(20 * Math.log10(wn * wn / Math.sqrt(den)));
        phase.push(Math.atan2(-im, re) * 180 / Math.PI);
      }
      return { w, mag, phase };
    }

    function stepResponse(wn, zeta) {
      const dt = 0.002, T = 8, n = Math.floor(T / dt);
      let x1 = 0, x2 = 0;
      const t = [], y = [];
      for (let i = 0; i < n; i++) {
        const u = 1;
        const dx1 = x2;
        const dx2 = -wn * wn * x1 - 2 * zeta * wn * x2 + wn * wn * u;
        x1 += dx1 * dt; x2 += dx2 * dt;
        t.push(i * dt); y.push(x1);
      }
      return { t, y };
    }

    function metrics(t, y) {
      const peak = Math.max(...y);
      let tPeak = 0;
      for (let i = 0; i < y.length; i++) if (y[i] === peak) { tPeak = t[i]; break; }
      const overshoot = peak > 1 ? (peak - 1) * 100 : 0;
      // 最后一次进入 ±2% 带
      let settle = t[t.length - 1];
      for (let i = y.length - 1; i >= 0; i--) {
        if (Math.abs(y[i] - 1) > 0.02) { settle = t[Math.min(i + 1, y.length - 1)]; break; }
      }
      return { overshoot, tPeak, settle };
    }

    function render() {
      const wn = parseFloat($('wn').value), zeta = parseFloat($('zeta').value);
      $('wn-val').textContent = wn.toFixed(1);
      $('zeta-val').textContent = zeta.toFixed(2);

      const b = bode(wn, zeta);
      Plotly.react('bode', [
        { x: b.w, y: b.mag, name: '幅值 (dB)', yaxis: 'y', line: {color:'#2563eb', width:2} },
        { x: b.w, y: b.phase, name: '相位 (°)', yaxis: 'y2', line: {color:'#f59e0b', width:2} }
      ], {
        margin: {l:56, r:56, t:44, b:44},
        title: {text: `Bode · ωn=${wn.toFixed(1)}, ζ=${zeta.toFixed(2)}`, font:{size:14}},
        xaxis: {title:'ω (rad/s)', type:'log'},
        yaxis: {title:'幅值 (dB)'},
        yaxis2: {title:'相位 (°)', overlaying:'y', side:'right'},
        legend: {orientation:'h', y:1.12},
        paper_bgcolor:'#fff', plot_bgcolor:'#fff'
      }, {responsive:true, displaylogo:false});

      const s = stepResponse(wn, zeta);
      const m = metrics(s.t, s.y);
      $('overshoot').textContent = m.overshoot.toFixed(1) + ' %';
      $('settle').textContent = m.settle.toFixed(2) + ' s';
      $('peak').textContent = m.tPeak.toFixed(2) + ' s';

      Plotly.react('step', [
        { x: s.t, y: s.y, name: 'y(t)', line: {color:'#16a34a', width:2} },
        { x: [s.t[0], s.t[s.t.length-1]], y: [1,1], name: '目标', line: {color:'#9ca3af', dash:'dash'} }
      ], {
        margin: {l:56, r:24, t:44, b:44},
        title: {text:'阶跃响应', font:{size:14}},
        xaxis: {title:'t (s)'}, yaxis: {title:'y'},
        legend: {orientation:'h', y:1.12},
        paper_bgcolor:'#fff', plot_bgcolor:'#fff'
      }, {responsive:true, displaylogo:false});
    }

    $('wn').addEventListener('input', render);
    $('zeta').addEventListener('input', render);
    render();
  </script>
</body>
</html>
