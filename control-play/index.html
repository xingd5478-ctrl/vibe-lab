<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Control Play · 二阶系统 · vibe-lab</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="kicker">vibe-lab / instrument 02</div>
      <h1>Control Play · 二阶系统</h1>
      <p class="sub">G(s) = ωn² / (s² + 2ζωn·s + ωn²) · 拖动滑杆，实时看 Bode 与阶跃响应。</p>
    </header>

    <div class="layout">
      <aside class="panel controls">
        <div class="field">
          <label>自然频率 ωn <output id="wn-val">4.0</output></label>
          <input id="wn" type="range" min="0.5" max="20" step="0.1" value="4" />
        </div>

        <div class="field">
          <label>阻尼比 ζ <output id="zeta-val">0.40</output></label>
          <input id="zeta" type="range" min="0.05" max="2" step="0.01" value="0.4" />
        </div>

        <div class="metrics">
          <div>超调量 <b id="overshoot">—</b></div>
          <div>峰值时间 <b id="peak">—</b></div>
          <div>调节时间（±2%） <b id="settle">—</b></div>
        </div>

        <p class="hint">提示：ζ &lt; 1 欠阻尼，ζ = 1 临界阻尼；拖动 ζ 看超调与振荡的变化。</p>
      </aside>

      <section class="charts">
        <div class="panel">
          <div class="panel-head">
            <h2>Bode 图</h2>
            <span class="meta" id="meta-bode">—</span>
          </div>
          <div class="chart" id="bode"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>阶跃响应</h2>
            <span class="meta">单位阶跃 · 数值积分</span>
          </div>
          <div class="chart" id="step"></div>
        </div>
      </section>
    </div>

    <footer>
      vibe-lab · 零依赖 SVG · 参数可写进 URL（?wn=4&amp;zeta=0.4） · 仅用于教学/复习演示。
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
