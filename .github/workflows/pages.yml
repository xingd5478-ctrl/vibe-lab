name: Deploy imu-lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "imu-lab/static/**"
      - "control-play/**"
      - "landing/**"
      - "about/**"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r landing/. _site/
          mkdir -p _site/imu _site/control _site/about
          cp -r imu-lab/static/. _site/imu/
          cp -r control-play/. _site/control/
          cp -r about/. _site/about/
          cp LICENSE _site/LICENSE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
