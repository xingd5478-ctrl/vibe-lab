name: Deploy imu-lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "imu-lab/static/**"
      - "control-play/**"
      - "simulink/**"
      - "landing/**"
      - "about/**"
      - "data/**"
      - "shared/i18n.js"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone tutorial content
        run: git clone --depth 1 https://github.com/xingd5478-ctrl/simulink-control-tutorial.git "$RUNNER_TEMP/simtut" || echo "clone failed"
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          cp -f imu-lab/static/chart.js control-play/chart.js
          cp -f imu-lab/static/chart.js simulink/chart.js
          mkdir -p _site
          cp -r landing/. _site/
          mkdir -p _site/imu _site/control _site/about _site/simulink
          cp -r imu-lab/static/. _site/imu/
          cp -r control-play/. _site/control/
          cp -r simulink/. _site/simulink/
          mkdir -p _site/simulink/course-src _site/simulink/course-img
          if [ -d "$RUNNER_TEMP/simtut" ]; then
            cp "$RUNNER_TEMP"/simtut/t*.m _site/simulink/course-src/ 2>/dev/null || true
            cp "$RUNNER_TEMP"/simtut/docs/images/*.png _site/simulink/course-img/ 2>/dev/null || true
            python3 -c "import json,os; d='_site/simulink/course-src'; json.dump(sorted(f for f in os.listdir(d) if f.endswith('.m')), open(os.path.join(d,'manifest.json'),'w'))"
            python3 -c "import json,os; d='_site/simulink/course-img'; json.dump(sorted(f for f in os.listdir(d) if f.endswith('.png')), open(os.path.join(d,'manifest.json'),'w'))"
          fi
          cp -r about/. _site/about/
          mkdir -p _site/data _site/shared
          cp data/matlab-probes.json data/feedback.json _site/data/
          cp shared/i18n.js _site/shared/
          cp LICENSE _site/LICENSE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
