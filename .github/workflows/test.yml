name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dev dependencies
        run: npm ci
      - name: Check layout/nav source
        run: npm run check:layout
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Run unit tests
        run: npm test
      - name: chart.js copies in sync
        run: node scripts/sync_chart.mjs --check
      - name: Static HTML/JS checks
        run: npm run check:static
      - name: SW asset manifest
        run: npm run check:sw
      - name: MATLAB provenance and table sync
        run: npm run check:matlab
      - name: JS/CSS performance budget
        run: node scripts/budget.mjs

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: DOM smoke (Edge CDP)
        run: node scripts/smoke.mjs
      - name: End-to-end (Edge CDP + axe, light/dark)
        run: node scripts/e2e.mjs
      - name: Runtime performance budget
        env:
          PERF_SCALE: "3"
        run: node scripts/perf.mjs
      - name: Big-file pipeline (Edge, 200k rows)
        run: node scripts/bigtest.mjs

  visual:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Visual regression (Edge)
        shell: pwsh
        run: |
          if (Test-Path "tests/baselines-ci") {
            pwsh -NoProfile -File scripts/visual.ps1 -BaselineDir "tests/baselines-ci" -Threshold 0.02
          } else {
            pwsh -NoProfile -File scripts/visual.ps1 -BaselineDir "tests/baselines-ci" -Update
            Write-Output "CI baselines bootstrapped (commit tests/baselines-ci from artifact)"
          }
      - name: Dark visual regression
        run: node scripts/dark_shots.mjs
      - name: Mobile 390px layout regression
        run: node scripts/mobile_shots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baselines
          path: |
            tests/baselines-ci
            artifacts/visual
          if-no-files-found: ignore
