name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unit tests
        run: npm test

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: End-to-end (Edge CDP + axe)
        run: node scripts/e2e.mjs
      - name: Big-file pipeline (Edge, 200k rows)
        run: node scripts/bigtest.mjs

  visual:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Visual regression (Edge)
        shell: pwsh
        run: |
          if (Test-Path "tests/baselines-ci") {
            pwsh -NoProfile -File scripts/visual.ps1 -BaselineDir "tests/baselines-ci" -Threshold 0.02
          } else {
            pwsh -NoProfile -File scripts/visual.ps1 -BaselineDir "tests/baselines-ci" -Update
            Write-Output "CI baselines bootstrapped (commit tests/baselines-ci from artifact)"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baselines
          path: |
            tests/baselines-ci
            artifacts/visual
          if-no-files-found: ignore
