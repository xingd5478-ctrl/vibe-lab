name: refresh visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Generate CI baselines
        shell: pwsh
        run: pwsh -NoProfile -File scripts/visual.ps1 -BaselineDir "tests/baselines-ci" -Update
      - name: Commit and push
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/baselines-ci
          if (git diff --cached --quiet) { Write-Output "no baseline changes"; exit 0 }
          git commit -m "ci: refresh visual baselines"
          git push
